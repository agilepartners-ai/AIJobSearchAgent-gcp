name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ secrets.GCP_GAR_LOCATION }}
  REPOSITORY: ${{ secrets.GCP_REPOSITORY }}
  SERVICE_NAME: ${{ secrets.GCP_SERVICE_NAME }}
  SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
  WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
  GH_SA_EMAIL: ${{ secrets.GH_SA_EMAIL }}
  
jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GH_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit build to Cloud Build
        run: |
          gcloud builds triggers run "${{ secrets.CLOUD_BUILD_TRIGGER_NAME }}" \
            --region="${{ secrets.CLOUD_BUILD_TRIGGER_REGION }}" \
            --branch="main" \
            --substitutions="_GAR_LOCATION=${{ env.GAR_LOCATION }},_REPOSITORY=${{ env.REPOSITORY }},_SERVICE_NAME=${{ env.SERVICE_NAME }},_SERVICE_ACCOUNT_EMAIL=${{ env.SERVICE_ACCOUNT_EMAIL }},_NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }},_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }},_NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }},_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }},_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }},_NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }},_NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }},_NEXT_PUBLIC_JSEARCH_API_KEY=${{ secrets.NEXT_PUBLIC_JSEARCH_API_KEY }},_NEXT_PUBLIC_JSEARCH_API_HOST=${{ secrets.NEXT_PUBLIC_JSEARCH_API_HOST }},_NEXT_PUBLIC_TAVUS_API_KEY=${{ secrets.NEXT_PUBLIC_TAVUS_API_KEY }},_NEXT_PUBLIC_OPENAI_API_KEY=${{ secrets.NEXT_PUBLIC_OPENAI_API_KEY }},_NEXT_PUBLIC_RESUME_API_BASE_URL=${{ secrets.NEXT_PUBLIC_RESUME_API_BASE_URL }},_NEXT_PUBLIC_RESUME_API_MODEL_TYPE=${{ secrets.NEXT_PUBLIC_RESUME_API_MODEL_TYPE }},_NEXT_PUBLIC_RESUME_API_MODEL=${{ secrets.NEXT_PUBLIC_RESUME_API_MODEL }}"

      - name: Get service URL
        id: get-url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GAR_LOCATION }} \
            --format="value(status.url)")
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "Service deployed at: $SERVICE_URL"

      - name: Deployment Summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Service: ${{ env.SERVICE_NAME }}"
          echo "Region: ${{ env.GAR_LOCATION }}"
          echo "URL: ${{ steps.get-url.outputs.url }}"

